<div class="app-container">
  <div class="premium-card main-layout">
    <app-navbar (onViewChange)="currentView = $event" (onOpenBot)="botOpen = true" (onOpenProfile)="profileOpen = true"></app-navbar>

    <ng-container [ngSwitch]="currentView">
      <!-- Home View (Default) -->
      <ng-container *ngSwitchCase="'home'">
        <app-sidebar [class.full-width]="!hasActiveChat" (openGroup)="createGroupOpen = true"></app-sidebar>
        <app-chat-area *ngIf="hasActiveChat"></app-chat-area>
      </ng-container>

      <!-- Notes View -->
      <ng-container *ngSwitchCase="'notes'">
        <app-note-list style="flex: 1"></app-note-list>
      </ng-container>

      <!-- Room View -->
      <ng-container *ngSwitchCase="'rooms'">
        <app-room-list style="flex: 1"></app-room-list>
      </ng-container>

      <!-- Calendar View -->
      <ng-container *ngSwitchCase="'calendar'">
        <app-calendar style="flex: 1"></app-calendar>
      </ng-container>

      <!-- Other Views (Placeholders) -->
    </ng-container>

    <app-bot-modal [isOpen]="botOpen" (close)="botOpen = false"></app-bot-modal>
    <app-profile-modal [isOpen]="profileOpen" [user]="user" (close)="profileOpen = false"></app-profile-modal>
    <app-create-group-modal [isOpen]="createGroupOpen" (close)="createGroupOpen = false" (created)="onGroupCreated($event)"></app-create-group-modal>
  </div>
</div>
