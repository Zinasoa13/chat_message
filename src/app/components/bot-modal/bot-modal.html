<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-content glass-card">
    <div class="modal-header">
      <div class="bot-info">
        <div class="bot-avatar">
          <img src="/logo.png" alt="Soachan">
          <div class="status-dot"></div>
        </div>
        <div class="text-info">
          <h2>SOACHAN AI</h2>
          <span class="status-text">Assistant Intelligent</span>
        </div>
      </div>
      <button class="close-btn" (click)="closeModal()">
        <span class="material-icons-rounded">close</span>
      </button>
    </div>

    <div class="chat-body custom-scrollbar" #scrollContainer>
      <div class="message" *ngFor="let msg of messages" [class.bot-msg]="msg.sender === 'bot'" [class.user-msg]="msg.sender === 'user'">
        <!-- Message Bubble (Markdown) -->
        <div class="msg-bubble" [innerHTML]="formatMessage(msg.content)"></div>

        <!-- Interactive Report Actions (Outside bubble) -->
        <div *ngIf="msg.type === 'INTERACTIVE_REPORT' && msg.data" class="report-actions fade-in">
          <p class="action-title">Partager ce rapport dans :</p>
          <div class="room-list">
            <button 
              *ngFor="let room of msg.data?.availableRooms"
              (click)="sendReport(room.id, msg.data.reportContent)"
              class="room-btn glass-btn">
              <span class="room-icon">{{ room.type === 'private' ? '💬' : '👥' }}</span>
              <span class="room-name">{{ room.name }}</span>
            </button>
          </div>
          <div *ngIf="msg.data?.availableRooms?.length === 0" class="no-rooms">
            <small>Aucune conversation disponible pour le partage.</small>
          </div>
        </div>
      </div>


      <!-- Typing Indicator -->
      <div class="message bot-msg" *ngIf="isBotTyping">
        <div class="msg-bubble typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <input #msgInput type="text" placeholder="Posez une question..." 
          (input)="onInputChange($event)"
          (keyup.enter)="sendMessage(msgInput.value); msgInput.value=''">
        <button class="send-btn" (click)="sendMessage(msgInput.value); msgInput.value=''">
          <span class="material-icons-rounded">send</span>
        </button>
      </div>
    </div>
  </div>
</div>
